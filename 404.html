<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages paths are case-sensitive: the project sites live at /CourseForge/ and
  // /Flash2Svg/. Any other spelling of them - /courseforge, /flash2svg/quick-start.html -
  // lands here and is sent on, keeping the rest of the address.
  (function () {
    var sites = { courseforge: '/CourseForge', flash2svg: '/Flash2Svg' };
    var m = location.pathname.match(/^\/(courseforge|flash2svg)(?=\/|$)(.*)$/i);
    if (m) location.replace(sites[m[1].toLowerCase()] + (m[2] || '/') + location.search + location.hash);
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  a { color: #0284c7; }
</style>
</head>
<body>
<main>
<h1>Not found</h1>
<p>There is nothing at this address. Looking for documentation?</p>
<p><a href="/CourseForge/">CourseForge</a> · <a href="/Flash2Svg/">Flash2SVG</a></p>
</main>
</body>
</html>
